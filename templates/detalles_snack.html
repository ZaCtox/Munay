{% extends 'layouts/base.html' %}
{% load static %}

{% block content %}<br>
    <div class="contenedor-detalle-producto">
        <header>
            <div class="nombre-detalle-producto">{{ producto.nombre }}</div>
        </header>

        <div class="imagen-detalle-producto">
            <img src="{{ producto.imagen.url }}" alt="{{ producto.nombre }}">
        </div>
        <div class="descripcion-detalle-producto">{{ producto.descripcion }}</div>
        <div class="precio-detalle-producto">1 Und: $ {{ producto.precio }}</div>
        {% if precio_2da_unidad < precio_doble %}
            <div class="precio-detalle-producto">2 Und: $ {{ precio_2da_unidad }}</div>
        {% endif %}<br>

        <form method="post" action="{% url 'agregar_al_carrito' %}" class="agregar-carrito-form">
            <div class="contenedor-botones-carrito">
                {% csrf_token %}
                <input type="hidden" name="producto_id" value="{{ producto.id }}">
                <input type="hidden" name="tipo" value="Snack">
                <div class="boton-izq">
                    <label for="cantidad">Cantidad:</label>
                    <input type="number" name="cantidad" id="cantidad" value="1" min="1">
                </div>
                <div class="boton-der">
                    <button type="submit" class="boton-agregar-carrito">Agregar al Carrito</button>
                </div>
            </div>
        </form>
    </div><br>

    <!-- Script de JavaScript -->
    <script>    
        // Almacenar cantidad en el carrito al hacer clic en Agregar
        const botonAgregar = document.querySelector('.boton-agregar-carrito');
        botonAgregar.addEventListener('click', function () {
            const productoId = this.getAttribute('data-id');
            const cantidadSeleccionada = parseInt(contador.textContent);

            // Verificar si la cantidad es un número válido
            if (!isNaN(cantidadSeleccionada) && cantidadSeleccionada > 0) {
                // Enviar la información al servidor utilizando Fetch API
                fetch('/agregar_al_carrito/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({
                        'producto_id': productoId,
                        'cantidad': cantidadSeleccionada
                    })
                })
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        throw new Error('Error al agregar el producto al carrito');
                    }
                })
                .then(data => {
                    console.log(data); // Manejar la respuesta del servidor, por ejemplo, mostrar un mensaje al usuario
                })
                .catch(error => {
                    console.error('Error:', error);
                });
            } else {
                console.error('La cantidad seleccionada no es válida.');
            }
        });    
    </script>
    
{% endblock %}
